<div class="grid grid-cols-[auto_25px] grid-rows-[auto_25px]">
    <ng-content></ng-content>
    <div class="relative">
        <div class="absolute left-[-20px] bottom-0 top-0">
            <div class="flex justify-around flex-col-reverse h-full">
                @for (char of rows(); track char) {
                    <div class="h-full">{{ char }}</div>
                }
            </div>
        </div>
    </div>
    <!-- Bottom Row -->
    <div class="bg-amber-100 flex justify-around">
        @for (char of files(); track char) {
            <div>{{ char }}</div>
        }
    </div>
    <div></div>
</div>
