<ng-template #unwrapped>
    <ng-content></ng-content>
</ng-template>

@if (active()) {
    <div class="grid grid-cols-[auto_25px] grid-rows-[auto_5vw]">
        <ng-container *ngTemplateOutlet="unwrapped"></ng-container>
        <div class="relative">
            <div class="absolute left-[-20px] bottom-0 top-0">
                <div class="flex justify-around flex-col-reverse h-full">
                    @for (char of rows(); track char) {
                        <div class="h-full">{{ char }}</div>
                    }
                </div>
            </div>
        </div>
        <!-- Bottom Row -->
        <div class="bg-amber-100 flex justify-around">
            @for (char of files(); track char) {
                <div class="w-full text-center">{{ char }}</div>
            }
        </div>
        <div></div>
    </div>
} @else {
    <ng-container *ngTemplateOutlet="unwrapped"></ng-container>
}
