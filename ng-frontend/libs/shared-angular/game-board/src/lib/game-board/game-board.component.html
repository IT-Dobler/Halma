<div class="container mx-auto">
    <form [formGroup]="form" (ngSubmit)="createEmptyGame()">
        <div formGroupName="bounds" class="flex flex-row">
            <div class="basis-1/4 flex flex-col">
                <label for="width" class="block p-2">Horizontal Elements</label>
                <input id="width" class="input block" [formControl]="form.controls.bounds.controls.width" type="number" min="2" max="16">
            </div>
            <div class="basis-1/4 flex flex-col">
                <label for="height" class="block p-2">Vertical Elements</label>
                <input id="height" class="input block" [formControl]="form.controls.bounds.controls.height" type="number" min="2" max="16">
            </div>
            <div class="basis-1/4 flex flex-col">
                <label for="corners" class="block p-2">Corners</label>
                <input id="corners" class="input block" [formControl]="form.controls.bounds.controls.cornerSize" type="number" min="0" max="4">
            </div>
            <div class="basis-1/4 flex flex-col">
                <label for="players" class="block p-2">Players</label>
                <input id="players" class="input block" [formControl]="form.controls.playerCount" type="number" min="1" max="4">
            </div>
        </div>
        <button type="submit" (click)="createEmptyGame()" class="btn-primary w-full">Create Game</button>
    </form>
</div>

<div class="container hidden">
    <pre>{{ form.value | json }}</pre>
</div>

@if(store.entities().length > 0){

    <div class="container mx-auto my-4 flex flex-row justify-end">
        <button (click)="rotateBoard(-90)" class="btn-default mr-2">Rotate: -90</button>
        <button (click)="rotateBoard(0)" class="btn-default mr-2">Rotate: Reset</button>
        <button (click)="rotateBoard(90)" class="btn-default">Rotate: +90</button>
    </div>

    <div class="container">
        <div id="table" class="aspect-square bg-gray-100 p-6 rotate-{{boardRotation}}">
            <div id="board" class="grid bg-amber-600 grid-cols-{{ form.value.bounds?.width }}">
                @for (node of store.entities(); track node.id) {
                    <app-node [node]="node" class="aspect-square border-solid border border-white"></app-node>
                }
            </div>
        </div>
    </div>
}
