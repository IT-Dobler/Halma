<div class="container mx-auto my-4 flex flex-row justify-end">
    <button (click)="setGameBoardRotationAngle(-90)" class="btn-default mr-2">Rotate: -90</button>
    <button (click)="setGameBoardRotationAngle(0)" class="btn-default mr-2">Rotate: Reset</button>
    <button (click)="setGameBoardRotationAngle(90)" class="btn-default">Rotate: +90</button>
</div>
