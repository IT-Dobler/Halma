[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = {version = "1", features = ["full"]}
axum = "0.8"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
serde_with = "3"
tower-http = { version = "0.6", features = ["fs"]}
tower-cookies = "0.11"
strum_macros = "0.26"
uuid = {version = "1", features = ["v4", "fast-rng"]}


lazy-regex = "3"
async-trait = "0.1"

[dev-dependencies]
anyhow = "1"
httpc-test = "0.1"